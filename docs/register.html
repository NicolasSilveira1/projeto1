<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .register-container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }
        .register-container h1 {
            margin-bottom: 20px;
        }
        .register-container input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .register-container button {
            width: 100%;
            padding: 10px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .register-container button:hover {
            background: #218838;
        }
        .message {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h1>Cadastro de Usuário</h1>
        <form id="registerForm">
            <input type="text" id="username" placeholder="Nome de Usuário" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Senha" required>
            <button type="submit">Cadastrar</button>
        </form>
        <p class="message" id="registerMessage"></p>
        <p>Já tem uma conta? <a href="login.html">Faça login</a></p>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        const message = document.getElementById('registerMessage');

        form.addEventListener('submit', (e) => {
            e.preventDefault(); // Impede o envio do formulário e recarregamento da página

            // Obtém os valores do formulário
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Verifica se o e-mail já está cadastrado
            const users = JSON.parse(localStorage.getItem('users')) || [];
            const userExists = users.find(user => user.email === email);

            if (userExists) {
                message.textContent = "Este e-mail já está cadastrado!";
                message.style.color = "red";
            } else {
                // Criptografa a senha (simulação simples de criptografia)
                const hashedPassword = btoa(password); // Codificação Base64 como exemplo simples
                const newUser = { username, email, password: hashedPassword };

                // Adiciona o novo usuário ao localStorage
                users.push(newUser);
                localStorage.setItem('users', JSON.stringify(users));

                // Exibe uma mensagem de sucesso
                message.textContent = "Usuário cadastrado com sucesso!";
                message.style.color = "green";
                form.reset(); // Limpa o formulário
            }
        });
    </script>
</body>
</html>
